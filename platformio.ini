; ============================================================================
; Robô Garçom IoT com Câmera — configuração do PlatformIO
; Placa: AI-Thinker ESP32-CAM (ESP32 + OV2640 + 4 MB PSRAM)
;
; Ambientes:
;   esp32cam      -> primeira gravação via USB (placa base ESP32-CAM-MB)
;   esp32cam_ota  -> gravações seguintes via Wi-Fi (robô já montado)
; ============================================================================

[env]
; Plataforma fixada para builds reproduzíveis (Arduino core 2.0.x).
; O código também compila no Arduino core 3.x (ver motors.cpp).
platform = espressif32@6.9.0
board = esp32cam
framework = arduino

; Tabela de partições com DUAS áreas de app (necessário para OTA).
; ~1,9 MB por app — o firmware ocupa ~1,1 MB.
board_build.partitions = min_spiffs.csv

; A placa "esp32cam" já define BOARD_HAS_PSRAM e a correção de cache da PSRAM.
; CORE_DEBUG_LEVEL: 0=nada, 1=erros, 3=info, 5=verbose
build_flags =
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; A ESP32-CAM-MB usa DTR/RTS para reset automático. Com eles ativos o monitor
; serial pode deixar a placa "presa" em reset ou em modo de gravação.
monitor_rts = 0
monitor_dtr = 0

[env:esp32cam]
upload_speed = 460800

[env:esp32cam_ota]
; Antes de usar: conecte o PC na rede Wi-Fi do robô (RoboGarcom-IoT).
upload_protocol = espota
upload_port = 192.168.4.1
; Deve ser igual a OTA_PASSWORD em src/config.h
upload_flags =
    --auth=garcom-ota
    --port=3232
